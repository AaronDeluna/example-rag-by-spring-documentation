# stub-mcp-server — MCP-сервер поверх stdio-транспорта.
# Веб-сервер не поднимаем, баннер выключен: stdout занят протоколом MCP.
spring.main.web-application-type=none
spring.main.banner-mode=off

# Настройки MCP-сервера
spring.ai.mcp.server.enabled=true
spring.ai.mcp.server.stdio=true
spring.ai.mcp.server.name=stub-mcp-server
spring.ai.mcp.server.version=1.0.0

# Логи не должны попадать в stdout (это сломает stdio-протокол) — уводим их в stderr.
# Перенаправление настроено в logback-spring.xml.
