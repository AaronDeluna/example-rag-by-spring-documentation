server:
  port: 8080

spring:
  mvc:
    # Включение логгирования параметов для o.s.web.servlet.DispatcherServlet
    log-request-details: true
  ai:
    mcp:
      server:
        # Используются настройки по умолчанию:
        # https://docs.spring.io/spring-ai/reference/1.0/api/mcp/mcp-server-boot-starter-docs.html
        stdio: false

logging:
  level:
    ROOT: DEBUG
    org.zalando.logbook: DEBUG
  file:
    name: ./logs/webmvc-mcp-server.log