# Agent Runner Configuration
# ==========================
# Настройки для запуска CLI-агентов (Qwen Code, Claude и др.)

# Выбор активного CLI-агента (значение = имя исполняемого файла CLI).
agent.cli=qwen

# --- Qwen CLI configuration ---

# Fallback-пути для поиска исполняемого файла qwen на разных ОС.
# Используются, если qwen не найден в системной переменной PATH.
# Разделитель между путями — точка с запятой (;).
agent.cli.qwen.fallback.linux=${user.home}/.npm-global/bin/qwen;${user.home}/.npm-global/lib/node_modules/@qwen-code/qwen-code/cli-entry.js
agent.cli.qwen.fallback.mac=${user.home}/.npm-global/bin/qwen
agent.cli.qwen.fallback.windows=${env.USERPROFILE}\\.npm-global\\bin\\qwen.cmd;${env.USERPROFILE}\\AppData\\Roaming\\npm\\qwen.cmd

# Базовые аргументы командной строки (без prompt, он добавляется автоматически в конце).
# Разделитель — запятая (,).
agent.cli.qwen.args=--output-format,stream-json,--approval-mode,yolo

# Префикс команды для Windows (cmd.exe /c).
# На Linux/macOS префикс не используется.
# Разделитель — запятая (,).
agent.cli.qwen.prefix.windows=cmd.exe,/c

# --- Песочница (изоляция запуска агента) ---
# По умолчанию ВКЛЮЧЕНА (true). macOS → sandbox-exec, Linux → bwrap, Windows → без ОС-песочницы.
# Запись разрешена только в workspace и logs; всё остальное — только чтение.
# Чтобы отключить: agent.cli.qwen.sandbox=false
#agent.cli.qwen.sandbox=true
# Доп. корни на запись, если CLI пишет вне workspace (через ;):
#agent.cli.qwen.sandbox.writable=${env.HOME}/.qwen
# Сеть в песочнице (агенту нужен доступ к LLM API):
#agent.cli.qwen.sandbox.network=true
